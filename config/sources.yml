# Source catalogue for the Open Science Monitor.
#
# Every source was fetched and verified before being enabled
# (last verified: 2026-11-20, from the build sandbox).
# To propose a new source, open a "Source suggestion" issue via the
# Sources page or .github/ISSUE_TEMPLATE/source-suggestion.yml.
#
# Fields:
#   id            stable slug used in data files and run reports
#   name          display name
#   url           public home page of the source
#   kind          funder | government | university | infrastructure |
#                 publisher | library-association | research-association |
#                 initiative | watchdog | un-agency
#   region        Europe | North America | Latin America & Caribbean |
#                 Africa | Asia Pacific | Global
#   language      ISO-ish code of the main publication language
#   method        rss | atom | page   (page = announcement page on manual watch)
#   feed          RSS/Atom URL (required for rss/atom methods)
#   enabled       true = collected by the weekly pipeline
#   priority      core (primary policy issuers we never want to miss)
#                 | supplementary (adds breadth or secondary context)
#   notes          free text, surfaced on the Sources page
#
# guidelines:
#   Prefer primary announcements and documents from the issuing body.
#   Before enabling a source: fetch the feed, confirm it parses, note the
#   date you checked. Disabled entries record known gaps.

coverage:
  scope: "OA/OS policy, funder mandates, consultations and implementation guidance; Diamond OA, APC/BPC, transformative agreements and publisher business models; repositories, rights retention, licensing and research data; research assessment reform, equity, multilingualism and Indigenous data governance; scholarly communication infrastructure; and peer-reviewed or institutional research on these topics. International scope, deliberately including non-Anglophone and Global South sources."
  gaps:
    - "UNESCO (recommended Open Access policy registry) blocks automated fetching from our environment; add a checked alternative (e.g. the ROARS-style API) before enabling."
    - "LIBER (European research libraries) returns 403 to our fetcher; needs a tailored user-agent strategy or manual watch before enabling."
    - "OpenAIRE blog RSS is not reachable from the build environment (site is slow / feed errors). Recheck before enabling."
    - "EU Research & Innovation news page and NIH Office of Science Policy have no stable RSS feed; listed as page-watch sources, collected manually until an API or feed is identified."
    - "German (DFG), Dutch (NWO), Austrian (FWF), Swiss (SNSF) and Argentine (CONICET) national funder sites expose no usable RSS feed at the moment; page-watch entries welcome."
    - "Africa coverage is weak: AJOL and AJOL-type infrastructure feeds could not be verified; a reviewed African OA/OS source is a priority need."
    - "US federal coverage beyond NSF (NIH, OSTP) needs page-watch sources; announcements appear in the monitor only if surfaced by a monitored feed or manual watch."
  as_of: "2026-11-20"
  how_to_add: "Open a Source suggestion issue (see the Sources page); after verification the maintainer flips enabled: true and records the date here."

