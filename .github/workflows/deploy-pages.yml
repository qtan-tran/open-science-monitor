# Website deployment to GitHub Pages (Source: GitHub Actions).
#
# Publication has been approved by the maintainer (2026-11-20), so the
# repository-level gate is removed. Every push to main builds the site and
# deploys it. One manual prerequisite in repo settings (once):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# The legacy "Deploy from a branch" mode serves a Jekyll default site instead
# of this build. Optional per-deploy approval gate at any time:
#   Settings -> Environments -> github-pages -> Required reviewers.

name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Validate, verify renders and build the site
        run: |
          node scripts/pipeline/validate-data.ts
          node scripts/render-issue-outputs.ts --check
          node scripts/build-site.ts

      # Sets the Pages base URL; enablement: true also turns Pages on
      # (build_type: workflow) if it is not enabled yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
