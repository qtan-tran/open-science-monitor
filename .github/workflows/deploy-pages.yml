# Website deployment to GitHub Pages.
#
# PUBLISHING GATE (two locks, both deliberate):
#  1. This workflow only runs when the repository variable PAGES_ENABLED is
#     "true" (Settings -> Secrets and variables -> Actions -> Variables).
#     Until you set it, nothing deploys, even after merging to main.
#  2. Keep Pages itself disabled (Settings -> Pages) until the site has been
#     reviewed. When enabling: Source = "GitHub Actions". Optionally set
#     Settings -> Environments -> github-pages -> Required reviewers as a
#     per-deploy approval gate.
# The repository can stay private while the Pages site is public; website
# visibility is independent of repository visibility.

name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Approval gate: flip the repository variable PAGES_ENABLED to "true"
    # when the site is approved for publication.
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Validate, verify renders and build the site
        run: |
          node scripts/pipeline/validate-data.ts
          node scripts/render-issue-outputs.ts --check
          node scripts/build-site.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
